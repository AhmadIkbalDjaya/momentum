name: Deploy Production
on:
  push:
    branches:
      - main
jobs:
  web-deploy:
    name: "Deploy Production"
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v6.0.1

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v6.1.0
        with: 
          node-version: 24
          cache: npm

      - name: 📦 Install Node dependencies
        run: npm ci

      - name: 🏗️ Build Frontend
        run: npm run build
        env:
          VITE_PUSHER_APP_KEY: ${{ secrets.PUSHER_APP_KEY }}
          VITE_PUSHER_HOST: ""
          VITE_PUSHER_PORT: ${{ vars.PUSHER_PORT }}
          VITE_PUSHER_SCHEME: ${{ vars.PUSHER_SCHEME }}
          VITE_PUSHER_APP_CLUSTER: ${{ vars.PUSHER_APP_CLUSTER }}

      - name: 📂 Sync Files
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          protocol: ${{ vars.FTP_PROTOCOL }}
          port: ${{ vars.FTP_PORT }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/docs/**

      - name: 📂 Sync Public
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: public/
          server-dir: ${{ vars.FTP_SERVER_PUBLIC_DIR }}
          protocol: ${{ vars.FTP_PROTOCOL }}
          port: ${{ vars.FTP_PORT }}

